name: MNCS Verify
description: Run a project verifier, validate its result, emit an execution receipt, and package provenance-bearing evidence.
author: epi13

branding:
  color: blue
  icon: check-circle

inputs:
  command:
    description: Shell command that runs the project verifier and writes result-file. Workflow-author controlled; do not pass untrusted PR content here.
    required: true
  working-directory:
    description: Directory in which command and result validation run.
    required: false
    default: .
  result-file:
    description: Path, relative to working-directory, of the JSON verification result.
    required: false
    default: .mncs/verification-result.json
  evidence-directory:
    description: Directory, relative to working-directory, for generated evidence.
    required: false
    default: .mncs/evidence
  fail-on-unknown:
    description: Fail the action when the verifier produces a valid UNKNOWN result.
    required: false
    default: "false"
  upload-artifact:
    description: Upload the generated evidence directory as a workflow artifact (including the execution receipt on negative paths).
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded evidence artifact.
    required: false
    default: mncs-verification-evidence

outputs:
  verdict:
    description: Verification verdict when a claim is established (PASS/FAIL/UNKNOWN), else INVALID for missing/malformed/invalid results.
    value: ${{ steps.package.outputs.verdict }}
  claim-status:
    description: ESTABLISHED when a valid verification claim exists, else NOT_ESTABLISHED.
    value: ${{ steps.package.outputs.claim-status }}
  evidence-path:
    description: Absolute path to the generated evidence manifest (only when a claim is established).
    value: ${{ steps.package.outputs.evidence-path }}
  result-path:
    description: Absolute path to the copied result in the evidence directory (only when a claim is established).
    value: ${{ steps.package.outputs.result-path }}
  execution-receipt-path:
    description: Absolute path to the execution receipt (always written, even when no claim is established).
    value: ${{ steps.package.outputs.execution-receipt-path }}
  manifest-digest:
    description: SHA-256 digest of the canonical evidence manifest.
    value: ${{ steps.package.outputs.manifest-digest }}
  provenance-digest:
    description: Deprecated alias for manifest-digest (the digest always covered the entire canonical manifest, not only provenance).
    value: ${{ steps.package.outputs.provenance-digest }}
  command-exit-code:
    description: Exit code returned by the project verifier command.
    value: ${{ steps.package.outputs.command-exit-code }}

runs:
  using: composite
  steps:
    - name: Run project verifier
      id: run-verifier
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: |
        set +e
        ${{ inputs.command }}
        status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Validate result and package evidence
      id: package
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MNCS_RESULT_FILE: ${{ inputs.result-file }}
        MNCS_EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        MNCS_COMMAND_EXIT_CODE: ${{ steps.run-verifier.outputs.exit-code }}
        MNCS_COMMAND_LABEL: ${{ inputs.command }}
      run: |
        set -euo pipefail
        if [[ -z "${MNCS_COMMAND_EXIT_CODE:-}" ]]; then
          echo "::error::Missing verifier exit code from run-verifier step."
          exit 2
        fi
        "$GITHUB_ACTION_PATH/verify.sh" --result-file "$MNCS_RESULT_FILE" --evidence-dir "$MNCS_EVIDENCE_DIRECTORY" --command-exit-code "$MNCS_COMMAND_EXIT_CODE" --command "$MNCS_COMMAND_LABEL"

    - name: Upload evidence artifact
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.evidence-directory }}
        if-no-files-found: error

    - name: Apply verification gate
      if: always()
      shell: bash
      env:
        MNCS_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
        MNCS_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        MNCS_VERDICT: ${{ steps.package.outputs.verdict }}
        MNCS_CLAIM_STATUS: ${{ steps.package.outputs.claim-status }}
        MNCS_COMMAND_EXIT_CODE: ${{ steps.package.outputs.command-exit-code }}
      run: |
        set -euo pipefail

        if [[ "$MNCS_PACKAGE_OUTCOME" != "success" ]]; then
          echo "::error::The verification claim was NOT ESTABLISHED (missing or malformed result; see execution receipt)."
          exit 1
        fi

        if [[ "$MNCS_CLAIM_STATUS" == "NOT_ESTABLISHED" || "$MNCS_VERDICT" == "INVALID" ]]; then
          echo "::error::The verification claim was NOT ESTABLISHED (missing or malformed result; see execution receipt)."
          exit 1
        fi

        if [[ "$MNCS_COMMAND_EXIT_CODE" != "0" ]]; then
          echo "::error::The verifier command exited with $MNCS_COMMAND_EXIT_CODE."
          exit 1
        fi

        case "$MNCS_VERDICT" in
          PASS)
            exit 0
            ;;
          FAIL)
            echo "::error::The verifier returned FAIL."
            exit 1
            ;;
          UNKNOWN)
            if [[ "$MNCS_FAIL_ON_UNKNOWN" == "true" ]]; then
              echo "::error::The verifier returned UNKNOWN and fail-on-unknown is enabled."
              exit 1
            fi
            echo "::warning::The verifier returned UNKNOWN."
            exit 0
            ;;
          *)
            echo "::error::The action produced an invalid verdict: $MNCS_VERDICT"
            exit 1
            ;;
        esac
