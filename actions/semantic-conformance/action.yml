name: MNCS Semantic Conformance
description: Discover an MNCS semantic contract, generate cases, execute them on the reference executor and requested backends, and package evidence-backed conformance. This action is the primary orchestration boundary for the question "does this implementation satisfy the semantic contract it claims?".
author: epi13

branding:
  color: green
  icon: shield

inputs:
  program:
    description: Semantic-contract program (.mncs source or program JSON) whose property/invariant/metamorphic clauses drive generation.
    required: true
  backends:
    description: Comma-separated backend names for differential execution.
    required: false
    default: mncs-portable-wasm-mvp,mncs-research-bytecode
  seed:
    description: Deterministic generation seed.
    required: false
    default: "1"
  cases:
    description: Generated cases per predicate (1..512).
    required: false
    default: "8"
  step-budget:
    description: Reference-execution step budget per case.
    required: false
    default: "200000"
  mncs-bin:
    description: Path to the mncs CLI binary.
    required: false
    default: mncs
  library-path:
    description: MNCS_LIBRARY_PATH for `use mncs.*` imports (empty inherits the environment).
    required: false
    default: ""
  working-directory:
    description: Directory in which the provider and validation run.
    required: false
    default: .
  result-file:
    description: Path, relative to working-directory, of the JSON check result.
    required: false
    default: .mncs/semantic-conformance-result.json
  evidence-directory:
    description: Directory, relative to working-directory, for generated evidence (check result plus conformance report).
    required: false
    default: .mncs/evidence
  fail-on-unknown:
    description: Fail this step when the provider produces a valid UNKNOWN check.
    required: false
    default: "false"
  fail-on-fail:
    description: Fail this step when the provider produces a valid FAIL check. Keep false when aggregation decides the boundary.
    required: false
    default: "false"
  upload-artifact:
    description: Upload the generated evidence directory as a workflow artifact.
    required: false
    default: "false"
  artifact-name:
    description: Name of the uploaded evidence artifact.
    required: false
    default: mncs-semantic-conformance-evidence

outputs:
  verdict:
    description: Conformance verdict when a claim is established (PASS/FAIL/UNKNOWN), else INVALID for missing/malformed results.
    value: ${{ steps.package.outputs.verdict }}
  claim-status:
    description: ESTABLISHED when a valid conformance claim exists, else NOT_ESTABLISHED.
    value: ${{ steps.package.outputs.claim-status }}
  evidence-path:
    description: Absolute path to the generated evidence manifest (only when a claim is established).
    value: ${{ steps.package.outputs.evidence-path }}
  result-path:
    description: Absolute path to the copied result in the evidence directory (only when a claim is established).
    value: ${{ steps.package.outputs.result-path }}
  execution-receipt-path:
    description: Absolute path to the execution receipt (always written, even when no claim is established).
    value: ${{ steps.package.outputs.execution-receipt-path }}
  manifest-digest:
    description: SHA-256 digest of the canonical evidence manifest.
    value: ${{ steps.package.outputs.manifest-digest }}
  command-exit-code:
    description: Exit code returned by the conformance provider command.
    value: ${{ steps.package.outputs.command-exit-code }}

runs:
  using: composite
  steps:
    - name: Run semantic conformance provider
      id: run-provider
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      env:
        MNCS_BIN: ${{ inputs.mncs-bin }}
      run: |
        set +e
        args=(
          --program "${{ inputs.program }}"
          --backends "${{ inputs.backends }}"
          --seed "${{ inputs.seed }}"
          --cases "${{ inputs.cases }}"
          --step-budget "${{ inputs.step-budget }}"
          --mncs-bin "${{ inputs.mncs-bin }}"
          --report-file "${{ inputs.evidence-directory }}/conformance-report.json"
          --result-file "${{ inputs.result-file }}"
        )
        if [[ -n "${{ inputs.library-path }}" ]]; then
          args+=(--library-path "${{ inputs.library-path }}")
        fi
        "$GITHUB_ACTION_PATH/../../scripts/semantic_conformance.py" "${args[@]}"
        status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Validate result and package evidence
      id: package
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MNCS_RESULT_FILE: ${{ inputs.result-file }}
        MNCS_EVIDENCE_DIRECTORY: ${{ inputs.evidence-directory }}
        MNCS_COMMAND_EXIT_CODE: ${{ steps.run-provider.outputs.exit-code }}
        MNCS_COMMAND_LABEL: semantic-conformance
      run: |
        set -euo pipefail
        if [[ -z "${MNCS_COMMAND_EXIT_CODE:-}" ]]; then
          echo "::error::Missing provider exit code from run-provider step."
          exit 2
        fi
        "$GITHUB_ACTION_PATH/../run-check/run_check.sh" --result-file "$MNCS_RESULT_FILE" --evidence-dir "$MNCS_EVIDENCE_DIRECTORY" --command-exit-code "$MNCS_COMMAND_EXIT_CODE" --command "$MNCS_COMMAND_LABEL" --expected-id semantic-conformance --expected-provider mncs-conformance-cli

    - name: Upload evidence artifact
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      # actions/upload-artifact v7.0.1
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.evidence-directory }}
        if-no-files-found: error

    - name: Apply conformance gate
      if: always()
      shell: bash
      env:
        MNCS_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
        MNCS_FAIL_ON_FAIL: ${{ inputs.fail-on-fail }}
        MNCS_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        MNCS_VERDICT: ${{ steps.package.outputs.verdict }}
        MNCS_CLAIM_STATUS: ${{ steps.package.outputs.claim-status }}
      run: |
        set -euo pipefail

        if [[ "$MNCS_PACKAGE_OUTCOME" != "success" ]]; then
          echo "::error::The conformance claim was NOT ESTABLISHED (missing or malformed result; see execution receipt)."
          exit 1
        fi

        if [[ "$MNCS_CLAIM_STATUS" == "NOT_ESTABLISHED" || "$MNCS_VERDICT" == "INVALID" ]]; then
          echo "::error::The conformance claim was NOT ESTABLISHED (missing or malformed result; see execution receipt)."
          exit 1
        fi

        if [[ "$MNCS_FAIL_ON_UNKNOWN" == "true" && "$MNCS_VERDICT" == "UNKNOWN" ]]; then
          echo "::error::The conformance provider produced UNKNOWN and fail-on-unknown is true."
          exit 1
        fi

        if [[ "$MNCS_FAIL_ON_FAIL" == "true" && "$MNCS_VERDICT" == "FAIL" ]]; then
          echo "::error::The conformance provider produced FAIL and fail-on-fail is true."
          exit 1
        fi
