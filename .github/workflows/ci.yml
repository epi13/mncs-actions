name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate shell syntax
        run: |
          bash -n actions/verify/verify.sh
          bash -n actions/run-check/run_check.sh
          bash -n actions/aggregate/aggregate.sh
          bash -n actions/render-badge/render_badge.sh

      - name: Validate JSON contracts
        run: |
          python3 -m json.tool schemas/verification-result.schema.json >/dev/null
          python3 -m json.tool schemas/evidence-manifest.schema.json >/dev/null
          python3 -m json.tool schemas/execution-receipt.schema.json >/dev/null
          python3 -m json.tool schemas/check-result.schema.json >/dev/null
          python3 -m json.tool schemas/aggregate-result.schema.json >/dev/null
          python3 -m json.tool schemas/badge.schema.json >/dev/null
          python3 -m json.tool schemas/family-contract-candidate.schema.json >/dev/null
          python3 -m json.tool schemas/family-producer-descriptor.schema.json >/dev/null
          python3 -m json.tool schemas/family-producer-output.schema.json >/dev/null
          python3 -m json.tool schemas/family-integration-evidence.schema.json >/dev/null
          python3 -m json.tool schemas/development-pressure-evidence.schema.json >/dev/null
          python3 -m json.tool family-producer-descriptors.json >/dev/null
          python3 scripts/family_contracts.py validate family-contracts.json
          for fixture in tests/fixtures/verify/pass.json tests/fixtures/verify/fail.json tests/fixtures/verify/unknown.json tests/fixtures/check/pass.json tests/fixtures/promotion/boundary.json tests/fixtures/promotion/mncs-pass.json tests/fixtures/promotion/mncds-pass.json tests/fixtures/promotion/promotion-pass.json tests/fixtures/promotion/canary-boundary.json tests/fixtures/promotion/obligation-open.json tests/fixtures/mncds/valid-pass.json tests/fixtures/mncds/obligations-resolved.json tests/fixtures/promotion-gate/boundary.json tests/fixtures/promotion-gate/authority-map.json tests/fixtures/promotion-gate/checks/mncs-pass.json tests/fixtures/promotion-gate/checks/mncds-pass.json tests/fixtures/promotion-gate/checks/obligations-pass.json tests/fixtures/promotion-gate/obligations/resolved.json tests/fixtures/promotion-gate/negatives/check-fail.json tests/fixtures/promotion-gate/negatives/check-unknown.json tests/fixtures/promotion-gate/negatives/check-wrong-provider.json tests/fixtures/promotion-gate/negatives/check-wrong-subject.json tests/fixtures/promotion-gate/negatives/check-missing-revision.json tests/fixtures/promotion-gate/negatives/obligation-open.json tests/fixtures/promotion-gate/negatives/obligation-rejected.json promotion/boundary.json promotion/authority-map.json; do
            python3 -m json.tool "$fixture" >/dev/null
          done

      - name: Validate contracts against schemas
        run: |
          pip install --require-hashes -r requirements-dev.lock
          check-jsonschema --schemafile schemas/verification-result.schema.json tests/fixtures/verify/pass.json tests/fixtures/verify/fail.json tests/fixtures/verify/unknown.json tests/fixtures/verify/extra-fields.json
          check-jsonschema --schemafile schemas/check-result.schema.json tests/fixtures/check/pass.json tests/fixtures/check/fail.json tests/fixtures/check/unknown.json tests/fixtures/promotion/mncs-pass.json tests/fixtures/promotion/mncds-pass.json tests/fixtures/promotion/promotion-pass.json
          check-jsonschema --schemafile schemas/family-producer-descriptor.schema.json family-producer-descriptors.json
          check-jsonschema --schemafile schemas/family-producer-output.schema.json tests/fixtures/family/producer-output.json
          check-jsonschema --schemafile schemas/family-integration-evidence.schema.json tests/fixtures/family/integration-evidence.json
          check-jsonschema --schemafile schemas/development-pressure-evidence.schema.json tests/fixtures/family/development-pressure-evidence.json
          # Negative fixtures must fail schema or canonical validation; assert the canonical lib rejects them.
          python3 -c "import sys; sys.path.insert(0,'lib'); import mncs_actions, json; assert mncs_actions.validate_verification_result(json.load(open('tests/fixtures/verify/contradictory-pass-with-fail.json')))"

      - name: Run deterministic test matrix
        run: |
          pip install --require-hashes -r requirements-dev.lock
          python3 -m pytest tests/ -q

      - name: Exercise verify action locally (PASS)
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/mncs-actions-self-test"
          rm -rf "$test_dir"
          mkdir -p "$test_dir/evidence"
          cp tests/fixtures/verify/pass.json "$test_dir/result.json"
          export GITHUB_OUTPUT="$test_dir/output"
          export GITHUB_STEP_SUMMARY="$test_dir/summary"
          export GITHUB_REPOSITORY="epi13/mncs-actions"
          export GITHUB_REF="refs/heads/main"
          export GITHUB_SHA="self-test"
          export GITHUB_WORKFLOW="CI"
          export GITHUB_RUN_ID="self-test"
          export GITHUB_ACTOR="self-test"
          export GITHUB_EVENT_NAME="workflow_dispatch"
          export RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          actions/verify/verify.sh --result-file "$test_dir/result.json" --evidence-dir "$test_dir/evidence" --command-exit-code 0 --command "self-test"
          grep -q '^verdict=PASS$' "$test_dir/output"
          grep -q '^claim-status=ESTABLISHED$' "$test_dir/output"
          grep -q '^manifest-digest=[a-f0-9]\{64\}$' "$test_dir/output"
          test -s "$test_dir/evidence/evidence-manifest.json"
          test -s "$test_dir/evidence/verification-result.json"
          test -s "$test_dir/evidence/execution-receipt.json"

      - name: Exercise composed run-check plus aggregate locally
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mncs-actions-compose-test"
          rm -rf "$work"
          mkdir -p "$work"
          cp tests/fixtures/check/pass.json "$work/mncs.json"
          cp tests/fixtures/check/unknown.json "$work/ebpf.json"
          export GITHUB_OUTPUT="$work/output-agg"
          export GITHUB_STEP_SUMMARY="$work/summary-agg"
          export GITHUB_REPOSITORY="epi13/mncs-actions"
          export GITHUB_REF="refs/heads/main"
          export GITHUB_SHA="self-test"
          export GITHUB_WORKFLOW="CI"
          export GITHUB_RUN_ID="self-test"
          export GITHUB_ACTOR="self-test"
          export GITHUB_EVENT_NAME="workflow_dispatch"
          export RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          actions/aggregate/aggregate.sh --checks "mncs.json ebpf.json" --required "mncs-validation,ebpf-backend" --evidence-dir "$work/agg-evidence" --working-dir "$work" --boundary "ci-self-test"
          grep -q '^verdict=UNKNOWN$' "$work/output-agg"
          test -s "$work/agg-evidence/aggregate-result.json"
          test -s "$work/agg-evidence/execution-receipt.json"
          python3 adapters/rights_adapter.py --input tests/fixtures/rights/review-required.json --output "$work/rights-check.json"
          python3 -c "import json; assert json.load(open('$work/rights-check.json'))['verdict']=='UNKNOWN'"
          python3 adapters/validator_adapter.py --input tests/fixtures/validator/valid-pass.json --output "$work/mncs-check.json"
          python3 -c "import json; assert json.load(open('$work/mncs-check.json'))['verdict']=='PASS'"

  family-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate fixture check-results via adapters
        run: |
          set -euo pipefail
          mkdir -p .mncs
          python3 adapters/validator_adapter.py --input tests/fixtures/validator/valid-pass.json --output .mncs/mncs-check.json --check-id mncs-validation --provider mncs-validator-rs --contract-revision 0.2
          python3 adapters/rights_adapter.py --input tests/fixtures/rights/pass.json --output .mncs/rights-check.json --check-id rights-provenance --provider mncs-rights-provenance --contract-revision 0.3.0
          cp tests/fixtures/check/pass.json .mncs/project-check.json
          python3 -c "import json; d=json.load(open('.mncs/project-check.json')); d['id']='project-tests'; d['provider']='project-verifier'; json.dump(d, open('.mncs/project-check.json','w'), indent=2, sort_keys=True)"

      - name: Run MNCS check (fixture command)
        uses: ./actions/run-check
        with:
          command: python3 adapters/validator_adapter.py --input tests/fixtures/validator/valid-pass.json --output .mncs/mncs-check.json --check-id mncs-validation --provider mncs-validator-rs
          check-id: mncs-validation
          provider: mncs-validator-rs
          result-file: .mncs/mncs-check.json
          evidence-directory: .mncs/mncs-evidence
          upload-artifact: "false"

      - name: Run rights check (fixture command)
        uses: ./actions/run-check
        with:
          command: python3 adapters/rights_adapter.py --input tests/fixtures/rights/pass.json --output .mncs/rights-check.json --check-id rights-provenance --provider mncs-rights-provenance
          check-id: rights-provenance
          provider: mncs-rights-provenance
          result-file: .mncs/rights-check.json
          evidence-directory: .mncs/rights-evidence
          upload-artifact: "false"

      - name: Run project check (repeated action use)
        uses: ./actions/run-check
        with:
          command: cp tests/fixtures/check/pass.json .mncs/project-check.json && python3 -c "import json; p='.mncs/project-check.json'; d=json.load(open(p)); d['id']='project-tests'; d['provider']='project-verifier'; json.dump(d, open(p,'w'), indent=2, sort_keys=True)"
          check-id: project-tests
          provider: project-verifier
          result-file: .mncs/project-check.json
          evidence-directory: .mncs/project-evidence
          upload-artifact: "false"

      - name: Aggregate family verdict
        id: aggregate
        uses: ./actions/aggregate
        with:
          checks: .mncs/mncs-check.json .mncs/rights-check.json .mncs/project-check.json
          required: mncs-validation,rights-provenance,project-tests
          optional: ebpf-backend
          boundary: ci-family-self-test
          evidence-directory: .mncs/aggregate-evidence
          fail-on-unknown: "true"
          upload-artifact: "true"
          artifact-name: mncs-family-self-test-evidence

      - name: Run legacy verify once (compatibility)
        uses: ./actions/verify
        with:
          command: cp tests/fixtures/verify/pass.json .mncs/verification-result.json
          result-file: .mncs/verification-result.json
          evidence-directory: .mncs/legacy-evidence
          fail-on-unknown: "true"
          artifact-name: mncs-legacy-verify-evidence

      - name: Render aggregate badge
        uses: ./actions/render-badge
        with:
          verdict: PASS
          label: MNCS family
          output-file: .mncs/mncs-badge.svg
          sidecar-file: .mncs/mncs-badge.json
          repository: epi13/mncs-actions
          subject-commit: self-test
          boundary: ci-family-self-test
          aggregate-digest: ${{ steps.aggregate.outputs.aggregate-digest }}
          manifest-digest: ${{ steps.aggregate.outputs.manifest-digest }}
          carrier-revision: self-test-carrier

  promotion-self-test:
    # mncs-actions verifies its own development/promotion path with the new
    # contracts: MNCDS record + obligations project locally, and the
    # promotion claim shape (as emitted by the owner-native MNCS evaluator)
    # validates and aggregates. The true evaluator step runs in the
    # fixed-revision family canary against the pinned MNCS revision.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Project MNCDS development record (fixture report)
        run: |
          set -euo pipefail
          mkdir -p .mncs
          python3 adapters/mncds_adapter.py --input tests/fixtures/mncds/valid-pass.json --output .mncs/mncds-check.json --check-id mncds-development-record --provider mncds --contract-revision 0.2-alpha.1 --subject-repository epi13/mncs-actions --subject-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          python3 -c "import json; assert json.load(open('.mncs/mncds-check.json'))['verdict']=='PASS'"

      - name: Project MNCDS obligations (fixture set)
        run: |
          set -euo pipefail
          python3 scripts/project_obligations.py --obligations tests/fixtures/mncds/obligations-resolved.json --subject-repository epi13/mncs-actions --subject-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --output .mncs/mncds-obligations-check.json
          python3 -c "import json; assert json.load(open('.mncs/mncds-obligations-check.json'))['verdict']=='PASS'"

      - name: Validate promotion claim shape and aggregate the path
        run: |
          set -euo pipefail
          python3 -c "import sys; sys.path.insert(0,'lib'); import mncs_actions, json; assert mncs_actions.validate_promotion_claim(json.load(open('tests/fixtures/promotion/promotion-pass.json')), boundary_id='family-promotion', subject_repository='epi13/mncs-actions', subject_commit='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa') == []"
          cp tests/fixtures/promotion/mncs-pass.json .mncs/mncs-check.json
          cp tests/fixtures/promotion/mncds-pass.json .mncs/mncds-check.json
          cp tests/fixtures/promotion/promotion-pass.json .mncs/promotion-check.json
          export GITHUB_OUTPUT="$RUNNER_TEMP/promotion-output"
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/promotion-summary"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          actions/aggregate/aggregate.sh --checks ".mncs/mncs-check.json .mncs/mncds-check.json .mncs/promotion-check.json" --required "mncs-validation,mncds-development-record,promotion-boundary" --evidence-dir .mncs/promotion-aggregate-evidence --working-dir . --boundary "ci-promotion-self-test"
          grep -q '^verdict=PASS$' "$RUNNER_TEMP/promotion-output"
          test -s .mncs/promotion-aggregate-evidence/aggregate-result.json

  boundary-matrix:
    # Shell-level boundary matrix: omission vs missing vs FAIL/UNKNOWN vs
    # explicit-missing vs nested working directory. Complements pytest with
    # GitHub-runner execution of the exact shipped scripts.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Omitted optional provider stays PASS
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/omitted-optional"
          rm -rf "$work"; mkdir -p "$work"
          cp tests/fixtures/check/pass.json "$work/mncs.json"
          cp tests/fixtures/check/rights-pass.json "$work/rights.json"
          export GITHUB_OUTPUT="$work/out" GITHUB_STEP_SUMMARY="$work/sum"
          export GITHUB_REPOSITORY="epi13/mncs-actions" GITHUB_REF="refs/heads/test" GITHUB_SHA="x" GITHUB_WORKFLOW="ci" GITHUB_RUN_ID="1" GITHUB_ACTOR="x" GITHUB_EVENT_NAME="push" RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          actions/aggregate/aggregate.sh --checks "mncs.json rights.json" --required "mncs-validation,rights-provenance" --optional "project-tests" --evidence-dir "$work/agg" --working-dir "$work" --boundary "omitted-optional"
          grep -q '^verdict=PASS$' "$work/out"

      - name: Absent required provider becomes UNKNOWN
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/absent-required"
          rm -rf "$work"; mkdir -p "$work"
          cp tests/fixtures/check/pass.json "$work/mncs.json"
          export GITHUB_OUTPUT="$work/out" GITHUB_STEP_SUMMARY="$work/sum"
          export GITHUB_REPOSITORY="epi13/mncs-actions" GITHUB_REF="refs/heads/test" GITHUB_SHA="x" GITHUB_WORKFLOW="ci" GITHUB_RUN_ID="1" GITHUB_ACTOR="x" GITHUB_EVENT_NAME="push" RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          actions/aggregate/aggregate.sh --checks "mncs.json" --required "mncs-validation,rights-provenance" --evidence-dir "$work/agg" --working-dir "$work" --boundary "absent-required"
          grep -q '^verdict=UNKNOWN$' "$work/out"
          grep -q '^claim-status=ESTABLISHED$' "$work/out"

      - name: Required FAIL dominates
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/required-fail"
          rm -rf "$work"; mkdir -p "$work"
          cp tests/fixtures/check/fail.json "$work/fail.json"
          cp tests/fixtures/check/unknown.json "$work/unk.json"
          export GITHUB_OUTPUT="$work/out" GITHUB_STEP_SUMMARY="$work/sum"
          export GITHUB_REPOSITORY="epi13/mncs-actions" GITHUB_REF="refs/heads/test" GITHUB_SHA="x" GITHUB_WORKFLOW="ci" GITHUB_RUN_ID="1" GITHUB_ACTOR="x" GITHUB_EVENT_NAME="push" RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          actions/aggregate/aggregate.sh --checks "fail.json unk.json" --required "project-tests,ebpf-backend" --evidence-dir "$work/agg" --working-dir "$work" --boundary "fail-dominance"
          grep -q '^verdict=FAIL$' "$work/out"

      - name: Explicit missing file stays INVALID
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/explicit-missing"
          rm -rf "$work"; mkdir -p "$work"
          cp tests/fixtures/check/pass.json "$work/real.json"
          export GITHUB_OUTPUT="$work/out" GITHUB_STEP_SUMMARY="$work/sum"
          export GITHUB_REPOSITORY="epi13/mncs-actions" GITHUB_REF="refs/heads/test" GITHUB_SHA="x" GITHUB_WORKFLOW="ci" GITHUB_RUN_ID="1" GITHUB_ACTOR="x" GITHUB_EVENT_NAME="push" RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          if actions/aggregate/aggregate.sh --checks "real.json no-such.json" --required "mncs-validation" --evidence-dir "$work/agg" --working-dir "$work" --boundary "explicit-missing"; then
            echo "::error::expected INVALID for explicitly listed missing file"; exit 1
          fi
          grep -q '^verdict=INVALID$' "$work/out"
          grep -q '^claim-status=NOT_ESTABLISHED$' "$work/out"

      - name: Nested working directory resolves once
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nested-caller"
          rm -rf "$root"; mkdir -p "$root/src"
          cp tests/fixtures/check/pass.json "$root/src/mncs.json"
          export GITHUB_OUTPUT="$root/out" GITHUB_STEP_SUMMARY="$root/sum"
          export GITHUB_REPOSITORY="epi13/mncs-actions" GITHUB_REF="refs/heads/test" GITHUB_SHA="x" GITHUB_WORKFLOW="ci" GITHUB_RUN_ID="1" GITHUB_ACTOR="x" GITHUB_EVENT_NAME="push" RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          # Composite invariant: already inside src, impl root is ".".
          (cd "$root/src" && "$GITHUB_WORKSPACE/actions/aggregate/aggregate.sh" --checks "mncs.json" --required "mncs-validation" --evidence-dir "agg-ev" --working-dir "." --boundary "nested")
          grep -q '^verdict=PASS$' "$root/out"
          test -f "$root/src/agg-ev/aggregate-result.json"
          test ! -e "$root/src/src"

      - name: Bare caller without local actions still works
        run: |
          set -euo pipefail
          caller="$RUNNER_TEMP/bare-caller"
          rm -rf "$caller"; mkdir -p "$caller"
          cp tests/fixtures/check/pass.json "$caller/mncs.json"
          export GITHUB_OUTPUT="$caller/out" GITHUB_STEP_SUMMARY="$caller/sum"
          export GITHUB_REPOSITORY="epi13/mncs-actions" GITHUB_REF="refs/heads/test" GITHUB_SHA="x" GITHUB_WORKFLOW="ci" GITHUB_RUN_ID="1" GITHUB_ACTOR="x" GITHUB_EVENT_NAME="push" RUNNER_NAME="github-hosted"
          touch "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          (cd "$caller" && "$GITHUB_WORKSPACE/actions/aggregate/aggregate.sh" --checks "mncs.json" --required "mncs-validation" --evidence-dir "agg" --working-dir "." --boundary "bare")
          grep -q '^verdict=PASS$' "$caller/out"

  reusable-smoke:
    # Exercises the portable reusable workflow itself (synchronized
    # immutable internal pins, omitted optional provider) with the local
    # path form. Proves the workflow resolves independently of caller
    # contents; cross-repo callers pin the workflow SHA and inherit the
    # same baked action pins (see docs/revision-coherence.md).
    uses: ./.github/workflows/mncs-family-verify.yml
    with:
      required-checks: mncs-validation,rights-provenance,family-extra
      optional-checks: project-tests
      additional-checks: .mncs/family-extra.json
      boundary: ci-reusable-smoke
      fail-on-unknown: true
      mncs-command: mkdir -p .mncs && python3 adapters/validator_adapter.py --input tests/fixtures/validator/valid-pass.json --output .mncs/mncs-check.json --check-id mncs-validation --provider mncs-validator-rs && cp tests/fixtures/check/pass.json .mncs/family-extra.json && python3 -c "import json; p='.mncs/family-extra.json'; d=json.load(open(p)); d['id']='family-extra'; d['provider']='ci-precomputed-provider'; json.dump(d, open(p,'w'), indent=2, sort_keys=True)"
      rights-command: mkdir -p .mncs && python3 adapters/rights_adapter.py --input tests/fixtures/rights/pass.json --output .mncs/rights-check.json --check-id rights-provenance --provider mncs-rights-provenance
      project-command: ""
      upload-artifacts: false
