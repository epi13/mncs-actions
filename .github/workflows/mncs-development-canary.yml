name: MNCS fixed development-loop canary

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "family-development-contract.json"
      - "requirements-forge-canary.lock"
      - "scripts/check_family_development_contract.py"
      - "actions/mncs-test/**"
      - "actions/mncs-debug/**"
      - "actions/run-check/**"
      - "tests/test_family_development_contract.py"
      - ".github/workflows/mncs-development-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-development-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Actions carrier
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify the Actions carrier subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked Actions dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock

      - name: Install locked Forge canary dependency
        run: python3 -m pip install --require-hashes -r requirements-forge-canary.lock

      - name: Validate the fixed development contract
        run: python3 scripts/check_family_development_contract.py --contract family-development-contract.json

      - name: Check out pinned mncs-language
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-language
          ref: 99a8048827a6bc74009b2c37b6c6500047245a4d
          path: family/mncs-language
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned mncs-test
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-test
          ref: e1caa6a8715b7275dc3a7c4f99755bfbeec63675
          path: family/mncs-test
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned RAVEL
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/RAVEL
          ref: 326460d0823359c59952b285b067abfeb445dc74
          path: family/RAVEL
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned mncs-debug
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-debug
          ref: e93c2e721aeff2c19cc87c46851cf96789f7f30f
          path: family/mncs-debug
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned Forge
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-forge
          ref: 4551c49f1b209c0315ea8f2a61e5e61af25bddf4
          path: family/mncs-forge
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned Commons
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/MNCS-Commons
          ref: 2d4ac3686edd5e0ae656d28009be1053b406b19c
          path: family/MNCS-Commons
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned language-service
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-language-service
          ref: 88b3c275249d119b2af471ea616a22eef1046597
          path: family/mncs-language-service
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned Doctor
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-doctor
          ref: 8a04de270ad847a5be455ea40fa453a5fcdf0279
          path: family/mncs-doctor
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned Atlas
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-atlas
          ref: 1864c4a468994bed261a1ed154715828cc3cb0e8
          path: family/mncs-atlas
          persist-credentials: false
          fetch-depth: 1

      - name: Verify every pinned checkout and artifact
        run: python3 scripts/check_family_development_contract.py --contract family-development-contract.json --workspace-root .

      - name: Build the pinned compiler and embed runtime
        run: |
          cargo build --locked --manifest-path family/mncs-language/Cargo.toml --bin mncs
          cargo build --locked --manifest-path family/mncs-language/Cargo.toml -p mncs-embed

      - name: Build bounded RAVEL verification plan for the failing fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mncs
          source="$GITHUB_WORKSPACE/family/mncs-test/tests/fixtures/first_class_failing.mncs"
          mncs="$GITHUB_WORKSPACE/family/mncs-language/target/debug/mncs"
          libraries="$GITHUB_WORKSPACE/family/mncs-test/native:$GITHUB_WORKSPACE/family/mncs-language/library"
          root="$(MNCS_LIBRARY_PATH="$libraries" "$mncs" test-inventory "$source" | python3 -c 'import json, sys; print(json.load(sys.stdin)["inventory"]["tests"][0]["function_identity"])')"
          python3 family/RAVEL/src/ravel/impact.py "$source" \
            --mncs "$mncs" \
            --library "$GITHUB_WORKSPACE/family/mncs-test/native" \
            --library "$GITHUB_WORKSPACE/family/mncs-language/library" \
            --root "$root" \
            --output "$GITHUB_WORKSPACE/.mncs/fail-plan.json"
          python3 - <<'PY'
          import json
          plan = json.load(open('.mncs/fail-plan.json', encoding='utf-8'))
          assert plan['schema_version'] == 'mncs.verification-plan/1'
          assert plan['selection']['selected_test_identities']
          assert plan['selection']['level'] == 'direct_dependents'
          assert plan['proof']['sufficient_to_stop'] is True
          print(json.dumps({
              'plan_id': plan['plan_id'],
              'level': plan['selection']['level'],
              'selected_test_count': len(plan['selection']['selected_test_identities']),
              'available_test_count': plan['selection']['available_test_count'],
              'escalation_reasons': plan['selection']['escalation_reasons'],
          }, sort_keys=True))
          PY

      - name: Demonstrate a passing first-class test through Actions transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mncs
          MNCS_TEST_BIN="$GITHUB_WORKSPACE/family/mncs-test/bin/mncs-test" \
          MNCS_BIN="$GITHUB_WORKSPACE/family/mncs-language/target/debug/mncs" \
          MNCS_SOURCE_FILE="$GITHUB_WORKSPACE/family/mncs-test/tests/self_suite.mncs" \
          MNCS_LIBRARY_PATH_INPUT="$GITHUB_WORKSPACE/family/mncs-test/native:$GITHUB_WORKSPACE/family/mncs-language/library" \
          MNCS_RESULT_FILE="$GITHUB_WORKSPACE/.mncs/pass-check.json" \
          MNCS_TEST_RESULT_FILE="$GITHUB_WORKSPACE/.mncs/pass-result.json" \
          MNCS_ARTIFACTS_DIRECTORY="$GITHUB_WORKSPACE/.mncs/pass-artifacts" \
          bash actions/mncs-test/test.sh
          bash actions/run-check/run_check.sh \
            --result-file .mncs/pass-check.json \
            --evidence-dir .mncs/pass-evidence \
            --command-exit-code 0 \
            --command "mncs test self_suite.mncs" \
            --expected-id mncs-test \
            --expected-provider mncs-test
          python3 -c "import json; assert json.load(open('.mncs/pass-check.json'))['verdict'] == 'PASS'"

      - name: Demonstrate a failing test into bounded debugger evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          MNCS_TEST_BIN="$GITHUB_WORKSPACE/family/mncs-test/bin/mncs-test" \
          MNCS_BIN="$GITHUB_WORKSPACE/family/mncs-language/target/debug/mncs" \
          MNCS_SOURCE_FILE="$GITHUB_WORKSPACE/family/mncs-test/tests/fixtures/first_class_failing.mncs" \
          MNCS_LIBRARY_PATH_INPUT="$GITHUB_WORKSPACE/family/mncs-test/native:$GITHUB_WORKSPACE/family/mncs-language/library" \
          MNCS_RESULT_FILE="$GITHUB_WORKSPACE/.mncs/fail-check.json" \
          MNCS_TEST_RESULT_FILE="$GITHUB_WORKSPACE/.mncs/fail-result.json" \
          MNCS_ARTIFACTS_DIRECTORY="$GITHUB_WORKSPACE/.mncs/fail-artifacts" \
          MNCS_VERIFICATION_PLAN="$GITHUB_WORKSPACE/.mncs/fail-plan.json" \
          bash actions/mncs-test/test.sh
          test_status=$?
          set -e
          test "$test_status" -eq 1
          bash actions/run-check/run_check.sh \
            --result-file .mncs/fail-check.json \
            --evidence-dir .mncs/fail-evidence \
            --command-exit-code "$test_status" \
            --command "mncs test first_class_failing.mncs" \
            --expected-id mncs-test \
            --expected-provider mncs-test \
            --scope-file .mncs/fail-plan.json
          python3 -c "import json; assert json.load(open('.mncs/fail-check.json'))['verdict'] == 'FAIL'"

          MNCS_DEBUG_BIN="$GITHUB_WORKSPACE/family/mncs-debug/bin/mncs-debug" \
          MNCS_BIN="$GITHUB_WORKSPACE/family/mncs-language/target/debug/mncs" \
          MNCS_LIBRARY_PATH_INPUT="$GITHUB_WORKSPACE/family/mncs-test/native:$GITHUB_WORKSPACE/family/mncs-language/library" \
          MNCS_DEBUG_TEST_RESULT_FILE="$GITHUB_WORKSPACE/.mncs/fail-result.json" \
          MNCS_DEBUG_DIAGNOSTIC_DEPTH=minimal \
          MNCS_DEBUG_WORKING_DIRECTORY="$GITHUB_WORKSPACE" \
          MNCS_DEBUG_CAPTURE_POLICY=failure-only \
          MNCS_DEBUG_MAX_EVENTS=256 \
          MNCS_DEBUG_MAX_VALUES=1024 \
          MNCS_DEBUG_MAX_VALUE_BYTES=4096 \
          MNCS_DEBUG_CHECK_FILE="$GITHUB_WORKSPACE/.mncs/debug-check.json" \
          MNCS_DEBUG_WITNESS_FILE="$GITHUB_WORKSPACE/.mncs/debug-witness.json" \
          MNCS_DEBUG_ARTIFACTS_DIRECTORY="$GITHUB_WORKSPACE/.mncs/debug-artifacts" \
          bash actions/mncs-debug/test.sh
          bash actions/run-check/run_check.sh \
            --result-file .mncs/debug-check.json \
            --evidence-dir .mncs/debug-evidence \
            --command-exit-code 0 \
            --command "mncs-debug bounded failure capture" \
            --expected-id mncs-debug \
            --expected-provider mncs-debug \
            --scope-file .mncs/fail-plan.json
          python3 - <<'PY'
          import json
          test_result = json.load(open('.mncs/fail-result.json', encoding='utf-8'))
          debug_check = json.load(open('.mncs/debug-check.json', encoding='utf-8'))
          assert test_result['verdict'] == 'FAIL'
          assert debug_check['verdict'] == 'PASS'
          assert debug_check['debug']['integration']['run_id'] == test_result['run_id']
          assert debug_check['debug']['integration']['test_execution']['execution_identity']
          assert debug_check['debug']['observation']['schema_revision'] == 'mncs.execution-observation/1'
          assert debug_check['debug']['observation']['identity']
          assert debug_check['debug']['observation']['completeness']['status'] == 'complete'
          assert debug_check['debug']['source_map']['schema_revision'] == 'mncs.execution-source-map/1'
          assert debug_check['debug']['source_map']['identity']
          PY

      - name: Run the real Forge diagnose-fix-verify test
        env:
          PYTHONPATH: ${{ github.workspace }}/family/mncs-forge/src
          MNCS_ACTIONS_HANDOFF_ROOT: ${{ github.workspace }}/.mncs
          RAVEL_REPO: ${{ github.workspace }}/family/RAVEL
        run: python3 -m pytest family/mncs-forge/tests/test_mncs_development.py -q --basetemp=.mncs/forge-basetemp

      - name: Upload fixed-loop evidence
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mncs-fixed-development-loop-evidence
          path: .mncs
          include-hidden-files: true
          if-no-files-found: warn
