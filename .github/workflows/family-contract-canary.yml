name: MNCS family contract canary

# Two distinct paths share this workflow file:
#
# 1. Fixed compatibility evidence (prepare / producers /
#    assemble-and-aggregate). Each owner-native producer runs in a separate
#    hosted job and can only contribute its own artifact envelope. The
#    aggregator job receives those envelopes and never checks out or
#    executes a family repository. This answers whether pinned authorities
#    still execute and produce coherent evidence; UNKNOWN may stay green.
#    It never claims the family is promotable.
# 2. Promotion gate (promotion-gate). A deterministic fixture universe is
#    evaluated against an explicit required promotion boundary and the job
#    fails unless promotion is exactly PASS. This answers whether the exact
#    pinned fixture set satisfies the boundary; it never claims the moving
#    family is promotable.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked protocol dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Build producer matrix from fixed contract
        id: matrix
        run: python3 scripts/family_contract_matrix.py --contracts family-contracts.json

  required-canary-tests:
    # These are metadata/adapter regressions. They do not run owner-native
    # family integrations; those are isolated in the producer matrix below.
    runs-on: ubuntu-latest
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out fixed family members
        # Revisions come from family-contracts.json (exact SHAs, never
        # @main). Hardcoding them here staled every advancement by design;
        # the canary test asserts the checkouts match the contract file.
        run: |
          set -euo pipefail
          python3 - family-contracts.json <<'PY'
          import json, subprocess, sys
          doc = json.load(open(sys.argv[1]))
          for entry in doc["repositories"]:
              slug = entry["repository"]
              path = entry["checkout_path"]
              revision = entry["revision"]
              subprocess.run(
                  ["git", "clone", "--quiet", "--depth", "1",
                   f"https://github.com/{slug}.git", path],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", path, "fetch", "--quiet", "--depth", "1",
                   "origin", revision],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", path, "checkout", "--quiet", revision],
                  check=True,
              )
              print(f"{slug} @ {revision[:12]} -> {path}")
          PY
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked canary dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Run required fixed-family metadata canaries
        env:
          MNCS_ACTIONS_FAMILY_ROOT: ${{ github.workspace }}
          MNCS_ACTIONS_REQUIRE_FAMILY: "1"
          MNCS_ACTIONS_MNCS_STANDARD_ROOT: ${{ github.workspace }}/family/mncs-standard
          MNCS_ACTIONS_RIGHTS_PROVENANCE_ROOT: ${{ github.workspace }}/family/rights-provenance
          MNCS_ACTIONS_MNCDS_ROOT: ${{ github.workspace }}/family/mncds
        run: >-
          python3 -m pytest -q tests/test_changeset_adapter.py
          tests/test_family_contracts.py
          --junitxml "$RUNNER_TEMP/mncs-family-canary.xml"
      - name: Fail closed if required family canary skipped or empty
        run: python3 scripts/check_junit.py "$RUNNER_TEMP/mncs-family-canary.xml"

  producers:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out one fixed family producer
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: ${{ matrix.checkout_path }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked producer dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Build fixed language compiler
        if: ${{ matrix.producer == 'mncs-language' }}
        run: cargo build --locked --manifest-path family/mncs-language/Cargo.toml --bin mncs
      - name: Execute bounded owner-native producer
        run: >-
          python3 scripts/family_producer.py
          --producer "${{ matrix.producer }}"
          --family-root .
          --actions-root .
          --contracts family-contracts.json
          --descriptors family-producer-descriptors.json
          --output-dir .mncs/producer-output
          ${{ matrix.producer == 'mncs-language' && '--language-binary family/mncs-language/target/debug/mncs' || '' }}
      - name: Upload producer-only evidence
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: family-producer-${{ matrix.producer }}
          path: .mncs/producer-output
          if-no-files-found: error

  assemble-and-aggregate:
    needs: [producers, required-canary-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download producer evidence envelopes
        # actions/download-artifact v6.0.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: family-producer-*
          path: .mncs/producers
          merge-multiple: false
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked aggregation dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Assemble fixed family evidence from artifacts only
        run: >-
          python3 scripts/assemble_family_evidence.py
          --contracts family-contracts.json
          --descriptors family-producer-descriptors.json
          --producer-root .mncs/producers
          --output-dir .mncs/fixed-family
      - name: Resolve pinned MNCS evaluator revision
        id: mncs-rev
        run: >-
          python3 -c "import json; contracts=json.load(open('family-contracts.json'));
          print('revision=' + next(r['revision'] for r in contracts['repositories'] if r['name'] == 'mncs-standard'))" >> "$GITHUB_OUTPUT"
      - name: Check out fixed MNCS promotion evaluator
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/machine-native-complexity-standard
          ref: ${{ steps.mncs-rev.outputs.revision }}
          path: family/mncs-standard
          persist-credentials: false
          fetch-depth: 1
      - name: Evaluate fixed family promotion boundary (owner-native)
        run: |
          set -euo pipefail
          checks="$(find .mncs/fixed-family/checks -maxdepth 1 -type f -name '*.json' | sort | tr '\n' ' ')"
          python3 family/mncs-standard/scripts/mncs_promotion_evaluate.py \
            --boundary tests/fixtures/promotion/canary-boundary.json \
            --checks $checks \
            --subject-repository epi13/mncs-actions \
            --subject-commit "$GITHUB_SHA" \
            --output .mncs/fixed-family/checks/promotion-boundary.json
          python3 - "$GITHUB_SHA" <<'PY'
          import json, sys
          sys.path.insert(0, 'lib')
          import mncs_actions as lib
          doc = json.load(open('.mncs/fixed-family/checks/promotion-boundary.json'))
          errors = lib.validate_promotion_claim(
              doc,
              boundary_id='family-fixed-promotion',
              subject_repository='epi13/mncs-actions',
              subject_commit=sys.argv[1],
          )
          assert not errors, errors
          print(f"promotion transport validation: {doc['verdict']}")
          PY
          echo "## Fixed family promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "- Promotion verdict: $(python3 -c "import json; print(json.load(open('.mncs/fixed-family/checks/promotion-boundary.json'))['verdict'])")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evaluator: owner-native MNCS (pinned family-contracts revision); transport validated the claim shape only." >> "$GITHUB_STEP_SUMMARY"
      - name: Aggregate fixed family verdict
        id: fixed-aggregate
        run: |
          set -euo pipefail
          checks="$(find .mncs/fixed-family/checks -maxdepth 1 -type f -name '*.json' | sort | tr '\n' ' ')"
          actions/aggregate/aggregate.sh \
            --checks "$checks" \
            --required "mncs-validation,rights-provenance,mncds-development-record,commons-family-compatibility,mncs-language-family-boundary,mncs-language-rights-projection,mncs-language-changeset-boundary,mncs-language-artifact-envelope,mncs-language-promotion-boundary,mncs-language-graph-coherence,forge-cell-contract" \
            --optional "promotion-boundary,mncs-language-acceptance" \
            --boundary "family-fixed-revision-compatibility" \
            --working-dir . \
            --evidence-dir .mncs/fixed-family/aggregate-evidence \
            --carrier-revision "$GITHUB_SHA" \
            --strict-membership true
          verdict="$(grep '^verdict=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          evidence_file=.mncs/fixed-family/family-contract-evidence.json
          pressure_file=.mncs/fixed-family/development-pressure/development-pressure-evidence.json
          pass_count="$(jq '[.checks[] | select(.verdict == "PASS")] | length' "$evidence_file")"
          fail_count="$(jq '[.checks[] | select(.verdict == "FAIL")] | length' "$evidence_file")"
          unknown_count="$(jq '[.checks[] | select(.verdict == "UNKNOWN")] | length' "$evidence_file")"
          unresolved_count="$(jq '.obligations | length' "$pressure_file")"
          new_count="$(jq '[.obligations[] | select(.lifecycle.reproduction == "NEW")] | length' "$pressure_file")"
          repeated_count="$(jq '[.obligations[] | select(.lifecycle.reproduction == "REPRODUCED")] | length' "$pressure_file")"
          not_reproduced_count="$(jq '.not_reproduced | length' "$pressure_file")"
          echo "## Fixed family canary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow execution: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "- MNCS evidence verdict: $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: $(jq -r '.mode' "$evidence_file")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checks: PASS=$pass_count FAIL=$fail_count UNKNOWN=$unknown_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- DevelopmentPressure: unresolved=$unresolved_count new=$new_count repeated=$repeated_count not-reproduced=$not_reproduced_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- UNKNOWN remains a valid evidence verdict and is not converted to workflow failure." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fixed family evidence and pressure
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mncs-family-fixed-revision-evidence
          path: .mncs/fixed-family
          if-no-files-found: error

  # Promotion gate: unlike the compatibility observation above (where
  # UNKNOWN stays green), this path answers whether an exact pinned
  # fixture universe satisfies an explicit promotion boundary. The
  # boundary is required here and the job fails unless promotion is
  # exactly PASS. This gate proves promotability of the fixture set;
  # it never claims the moving family is promotable.
  promotion-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Resolve pinned MNCS evaluator revision
        id: mncs-rev
        run: >-
          python3 -c "import json; contracts=json.load(open('family-contracts.json'));
          print('revision=' + next(r['revision'] for r in contracts['repositories'] if r['name'] == 'mncs-standard'))" >> "$GITHUB_OUTPUT"
      - name: Check out fixed MNCS promotion evaluator
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/machine-native-complexity-standard
          ref: ${{ steps.mncs-rev.outputs.revision }}
          path: family/mncs-standard
          persist-credentials: false
          fetch-depth: 1
      - name: Assert the promotion-gate contract
        run: |
          set -euo pipefail
          mkdir -p .mncs/promotion-gate
          python3 scripts/check_promotion_gate.py \
            --evaluator family/mncs-standard/scripts/mncs_promotion_evaluate.py \
            --fixtures tests/fixtures/promotion-gate \
            --lib-dir lib \
            --output-dir .mncs/promotion-gate \
            --summary "$GITHUB_STEP_SUMMARY"
          python3 scripts/render_promotion_summary.py \
            --input .mncs/promotion-gate/promotion-pass.json \
            --output .mncs/promotion-gate/summary.md
          cat .mncs/promotion-gate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload promotion-gate evidence
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mncs-promotion-gate-evidence
          path: .mncs/promotion-gate
          if-no-files-found: error
