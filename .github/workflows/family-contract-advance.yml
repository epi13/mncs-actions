name: MNCS family contract advancement proposal

# Manual, auditable candidate advancement.  This workflow resolves moving
# heads, runs the complete fixed-style integration against those exact
# candidates, and uploads the evidence.  It never edits family-contracts.json
# or promotes a revision set.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose-family-advancement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked canary dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock

      - name: Resolve candidate family revision set
        id: resolve
        run: |
          mkdir -p .mncs
          python3 scripts/family_contracts.py propose \
            --contracts family-contracts.json \
            --branch main \
            --output .mncs/family-contract-candidate.json

      - name: Check out candidate family revisions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/machine-native-complexity-standard
          ref: ${{ steps.resolve.outputs.mncs_standard }}
          path: family/mncs-standard
          persist-credentials: false
          fetch-depth: 1
      - name: Check out candidate rights/provenance
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-rights-provenance
          ref: ${{ steps.resolve.outputs.rights_provenance }}
          path: family/rights-provenance
          persist-credentials: false
          fetch-depth: 1
      - name: Check out candidate MNCDS
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/machine-native-complexity-development-specification
          ref: ${{ steps.resolve.outputs.mncds }}
          path: family/mncds
          persist-credentials: false
          fetch-depth: 1
      - name: Check out candidate Commons
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/MNCS-Commons
          ref: ${{ steps.resolve.outputs.commons }}
          path: family/commons
          persist-credentials: false
          fetch-depth: 1
      - name: Check out candidate mncs-language
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-language
          ref: ${{ steps.resolve.outputs.mncs_language }}
          path: family/mncs-language
          persist-credentials: false
          fetch-depth: 1
      - name: Check out candidate Forge
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: epi13/mncs-forge-mcp
          ref: ${{ steps.resolve.outputs.forge }}
          path: family/forge
          persist-credentials: false
          fetch-depth: 1

      - name: Build candidate language compiler
        run: cargo build --locked --manifest-path family/mncs-language/Cargo.toml --bin mncs

      - name: Validate candidate and execute full family contract path
        run: |
          python3 scripts/family_contracts.py validate \
            .mncs/family-contract-candidate.json \
            --fixed family-contracts.json \
            --checkouts-root .
          python3 scripts/family_contracts.py promote \
            --candidate .mncs/family-contract-candidate.json \
            --fixed family-contracts.json \
            --output .mncs/proposed-family-contracts.json
          python3 scripts/family_contracts.py validate .mncs/proposed-family-contracts.json
          python3 scripts/run_family_contracts.py \
            --family-root . \
            --actions-root . \
            --contracts .mncs/family-contract-candidate.json \
            --fixed-contracts family-contracts.json \
            --output-dir .mncs/advancement-candidate \
            --language-binary family/mncs-language/target/debug/mncs
          checks="$(find .mncs/advancement-candidate -maxdepth 1 -type f -name '*.json' ! -name 'family-contract-evidence.json' | sort | tr '\n' ' ')"
          actions/aggregate/aggregate.sh \
            --checks "$checks" \
            --required "mncs-validation,rights-provenance,mncds-development-record,commons-family-compatibility,mncs-language-family-boundary,mncs-language-rights-projection,mncs-language-changeset-boundary,forge-cell-contract" \
            --boundary "family-contract-advancement-candidate" \
            --working-dir . \
            --evidence-dir .mncs/advancement-candidate/aggregate-evidence \
            --carrier-revision "$GITHUB_SHA" \
            --strict-membership true
          echo "Candidate evidence is advisory; promotion remains a reviewed change to family-contracts.json."

      - name: Upload advancement proposal evidence
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mncs-family-contract-advancement-candidate
          path: .mncs
          if-no-files-found: error
