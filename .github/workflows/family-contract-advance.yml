name: MNCS family contract advancement proposal

# Manual, auditable candidate advancement. Resolution, owner execution,
# artifact assembly, and proposal generation are separate jobs. This workflow
# never edits family-contracts.json and has no contents write permission.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked protocol dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Resolve candidate family revision set
        run: |
          mkdir -p .mncs
          python3 scripts/family_contracts.py propose \
            --contracts family-contracts.json \
            --branch main \
            --output .mncs/family-contract-candidate.json
      - name: Build candidate producer matrix
        id: matrix
        run: >-
          python3 scripts/family_contract_matrix.py
          --contracts .mncs/family-contract-candidate.json
          --fixed family-contracts.json
      - name: Upload candidate document
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: advancement-candidate
          path: .mncs/family-contract-candidate.json
          if-no-files-found: error

  producers:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download candidate document
        # actions/download-artifact v6.0.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: advancement-candidate
          path: .mncs/candidate
      - name: Check out one exact candidate producer
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: ${{ matrix.checkout_path }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked producer dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Build candidate language compiler
        if: ${{ matrix.producer == 'mncs-language' }}
        run: cargo build --locked --manifest-path family/mncs-language/Cargo.toml --bin mncs
      - name: Validate exact candidate checkout
        run: >-
          python3 scripts/family_contracts.py validate
          .mncs/candidate/family-contract-candidate.json
          --fixed family-contracts.json
      - name: Execute bounded candidate producer
        run: >-
          python3 scripts/family_producer.py
          --producer "${{ matrix.producer }}"
          --family-root .
          --actions-root .
          --contracts .mncs/candidate/family-contract-candidate.json
          --fixed-contracts family-contracts.json
          --descriptors family-producer-descriptors.json
          --output-dir .mncs/producer-output
          ${{ matrix.producer == 'mncs-language' && '--language-binary family/mncs-language/target/debug/mncs' || '' }}
      - name: Upload candidate producer evidence
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: advancement-producer-${{ matrix.producer }}
          path: .mncs/producer-output
          if-no-files-found: error

  assemble-and-propose:
    needs: producers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out mncs-actions
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download candidate document
        # actions/download-artifact v6.0.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: advancement-candidate
          path: .mncs/candidate
      - name: Download producer evidence
        # actions/download-artifact v6.0.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: advancement-producer-*
          path: .mncs/producers
          merge-multiple: false
      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked aggregation dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate candidate and write separate proposal
        run: |
          python3 scripts/family_contracts.py validate \
            .mncs/candidate/family-contract-candidate.json \
            --fixed family-contracts.json
          python3 scripts/family_contracts.py promote \
            --candidate .mncs/candidate/family-contract-candidate.json \
            --fixed family-contracts.json \
            --output .mncs/proposed-family-contracts.json
          python3 scripts/family_contracts.py validate .mncs/proposed-family-contracts.json
      - name: Assemble candidate evidence from artifacts only
        run: >-
          python3 scripts/assemble_family_evidence.py
          --contracts .mncs/candidate/family-contract-candidate.json
          --fixed-contracts family-contracts.json
          --descriptors family-producer-descriptors.json
          --producer-root .mncs/producers
          --output-dir .mncs/advancement-candidate
      - name: Aggregate candidate observation
        id: aggregate
        run: |
          set -euo pipefail
          checks="$(find .mncs/advancement-candidate/checks -maxdepth 1 -type f -name '*.json' | sort | tr '\n' ' ')"
          actions/aggregate/aggregate.sh \
            --checks "$checks" \
            --required "mncs-validation,rights-provenance,mncds-development-record,commons-family-compatibility,mncs-language-family-boundary,mncs-language-rights-projection,mncs-language-changeset-boundary,mncs-language-artifact-envelope,forge-cell-contract" \
            --boundary "family-contract-advancement-candidate" \
            --working-dir . \
            --evidence-dir .mncs/advancement-candidate/aggregate-evidence \
            --carrier-revision "$GITHUB_SHA" \
            --strict-membership true
          verdict="$(grep '^verdict=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          evidence_file=.mncs/advancement-candidate/family-contract-evidence.json
          pressure_file=.mncs/advancement-candidate/development-pressure/development-pressure-evidence.json
          pass_count="$(jq '[.checks[] | select(.verdict == "PASS")] | length' "$evidence_file")"
          fail_count="$(jq '[.checks[] | select(.verdict == "FAIL")] | length' "$evidence_file")"
          unknown_count="$(jq '[.checks[] | select(.verdict == "UNKNOWN")] | length' "$evidence_file")"
          unresolved_count="$(jq '.obligations | length' "$pressure_file")"
          new_count="$(jq '[.obligations[] | select(.lifecycle.reproduction == "NEW")] | length' "$pressure_file")"
          repeated_count="$(jq '[.obligations[] | select(.lifecycle.reproduction == "REPRODUCED")] | length' "$pressure_file")"
          not_reproduced_count="$(jq '.not_reproduced | length' "$pressure_file")"
          echo "## Family advancement proposal" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate evidence verdict: $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: $(jq -r '.mode' "$evidence_file")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checks: PASS=$pass_count FAIL=$fail_count UNKNOWN=$unknown_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- DevelopmentPressure: unresolved=$unresolved_count new=$new_count repeated=$repeated_count not-reproduced=$not_reproduced_count" >> "$GITHUB_STEP_SUMMARY"
          echo "- Proposal remains advisory; promotion requires a reviewed family-contracts.json change." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload advancement proposal evidence
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mncs-family-contract-advancement-candidate
          path: .mncs
          if-no-files-found: error
