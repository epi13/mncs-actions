name: MNCS family verify

# First practical reusable family verification workflow.
#
# A repository invokes this with a pinned revision:
#
#   jobs:
#     mncs:
#       uses: epi13/mncs-actions/.github/workflows/mncs-family-verify.yml@<pinned-revision>
#       with:
#         required-checks: mncs-validation,rights-provenance,project-tests
#         mncs-command: ./scripts/mncs-check.sh
#         rights-command: ./scripts/rights-check.sh
#         project-command: ./scripts/project-verify.sh
#
# Composition is role-based: leave a command empty to mark that provider
# not applicable for the caller.  "Not applicable" is never recorded as
# PASS; the check is simply absent and the required set decides the
# boundary.  Unavailable required coverage becomes UNKNOWN/FAIL, never PASS.
#
# Trust domains: this workflow runs on the caller's runner (expected
# GitHub-hosted for public PRs). It never dispatches to privileged
# self-hosted MNCS workers; hardware-gated checks must report UNKNOWN
# when their runner is unavailable.
#
# Revision coherence (see docs/revision-coherence.md):
# internal actions are referenced as
# epi13/mncs-actions/actions/<name>@<pinned-sha> with an immutable
# full-length commit SHA so a caller pinning workflow revision X always
# executes exactly the action implementation baked at X -- never a
# floating branch. Do NOT use ./actions/... here: inside a reusable
# workflow that form resolves to the CALLER repository, which breaks every
# real family caller. Do NOT use @main/@vN here: a historical workflow
# revision must not silently execute a newer action implementation.
# On release, run scripts/sync-pins.sh <release-sha> so the baked pins
# equal the release revision, then tag the release.

on:
  workflow_call:
    inputs:
      required-checks:
        description: Comma separated required check ids (e.g. mncs-validation,rights-provenance,project-tests).
        required: true
        type: string
      optional-checks:
        description: Comma separated optional check ids (UNKNOWN stays visible but does not decide the boundary).
        required: false
        default: ""
        type: string
      boundary:
        description: Declared aggregate boundary name.
        required: false
        default: family
        type: string
      fail-on-unknown:
        description: Fail when the aggregate verdict is UNKNOWN.
        required: false
        default: true
        type: boolean
      working-directory:
        description: Directory checked out by the caller where commands run.
        required: false
        default: .
        type: string
      mncs-command:
        description: Provider command writing the MNCS check-result (empty = not applicable).
        required: false
        default: ""
        type: string
      mncs-check-id:
        required: false
        default: mncs-validation
        type: string
      mncs-provider:
        required: false
        default: mncs-validator-rs
        type: string
      mncs-result-file:
        required: false
        default: .mncs/mncs-check.json
        type: string
      mncs-evidence-dir:
        required: false
        default: .mncs/mncs-evidence
        type: string
      rights-command:
        description: Provider command writing the rights check-result (empty = not applicable).
        required: false
        default: ""
        type: string
      rights-check-id:
        required: false
        default: rights-provenance
        type: string
      rights-provider:
        required: false
        default: mncs-rights-provenance
        type: string
      rights-result-file:
        required: false
        default: .mncs/rights-check.json
        type: string
      rights-evidence-dir:
        required: false
        default: .mncs/rights-evidence
        type: string
      project-command:
        description: Provider command writing the project check-result (empty = not applicable).
        required: false
        default: ""
        type: string
      project-check-id:
        required: false
        default: project-tests
        type: string
      project-provider:
        required: false
        default: project-verifier
        type: string
      project-result-file:
        required: false
        default: .mncs/project-check.json
        type: string
      project-evidence-dir:
        required: false
        default: .mncs/project-evidence
        type: string
      additional-checks:
        description: Whitespace or comma separated paths to precomputed check-result/1 files. Their ids must be listed in required-checks or optional-checks.
        required: false
        default: ""
        type: string
      aggregate-evidence-dir:
        required: false
        default: .mncs/aggregate-evidence
        type: string
      carrier-revision:
        description: Caller-asserted SHA/ref of the workflow carrier, recorded as provenance only.
        required: false
        default: ""
        type: string
      badge-label:
        description: Label for the deterministic presentation badge.
        required: false
        default: MNCS verification
        type: string
      badge-file:
        description: SVG badge path, relative to working-directory.
        required: false
        default: .mncs/mncs-badge.svg
        type: string
      badge-sidecar-file:
        description: Machine-readable badge sidecar path, relative to working-directory.
        required: false
        default: .mncs/mncs-badge.json
        type: string
      upload-artifacts:
        required: false
        default: true
        type: boolean
    outputs:
      verdict:
        description: Aggregate verdict PASS/FAIL/UNKNOWN.
        value: ${{ jobs.family-verify.outputs.verdict }}
      manifest-digest:
        description: Digest of the canonical aggregate manifest.
        value: ${{ jobs.family-verify.outputs.manifest-digest }}
      aggregate-path:
        description: Path to the aggregate-result document.
        value: ${{ jobs.family-verify.outputs.aggregate-path }}
      aggregate-digest:
        description: SHA-256 digest of the aggregate-result document.
        value: ${{ jobs.family-verify.outputs.aggregate-digest }}
      badge-path:
        description: Path to the rendered SVG badge.
        value: ${{ jobs.family-verify.outputs.badge-path }}
      badge-sidecar-path:
        description: Path to the machine-readable badge sidecar.
        value: ${{ jobs.family-verify.outputs.badge-sidecar-path }}
  workflow_dispatch:
    inputs:
      required-checks:
        description: Required check ids.
        required: false
        default: demo-mncs,demo-rights

permissions:
  contents: read

jobs:
  family-verify:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.aggregate.outputs.verdict }}
      manifest-digest: ${{ steps.aggregate.outputs.manifest-digest }}
      aggregate-path: ${{ steps.aggregate.outputs.aggregate-path }}
      aggregate-digest: ${{ steps.aggregate.outputs.aggregate-digest }}
      badge-path: ${{ steps.badge.outputs.badge-path }}
      badge-sidecar-path: ${{ steps.badge.outputs.sidecar-path }}
    steps:
      - name: Check out caller repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: MNCS validation check
        id: mncs
        if: ${{ inputs.mncs-command != '' }}
        uses: epi13/mncs-actions/actions/run-check@f6b70a897632e5c077633be7777847ee9c78feab
        with:
          command: ${{ inputs.mncs-command }}
          check-id: ${{ inputs.mncs-check-id }}
          provider: ${{ inputs.mncs-provider }}
          working-directory: ${{ inputs.working-directory }}
          result-file: ${{ inputs.mncs-result-file }}
          evidence-directory: ${{ inputs.mncs-evidence-dir }}
          upload-artifact: "false"

      - name: Rights and provenance check
        id: rights
        if: ${{ inputs.rights-command != '' }}
        uses: epi13/mncs-actions/actions/run-check@f6b70a897632e5c077633be7777847ee9c78feab
        with:
          command: ${{ inputs.rights-command }}
          check-id: ${{ inputs.rights-check-id }}
          provider: ${{ inputs.rights-provider }}
          working-directory: ${{ inputs.working-directory }}
          result-file: ${{ inputs.rights-result-file }}
          evidence-directory: ${{ inputs.rights-evidence-dir }}
          upload-artifact: "false"

      - name: Project verification check
        id: project
        if: ${{ inputs.project-command != '' }}
        uses: epi13/mncs-actions/actions/run-check@f6b70a897632e5c077633be7777847ee9c78feab
        with:
          command: ${{ inputs.project-command }}
          check-id: ${{ inputs.project-check-id }}
          provider: ${{ inputs.project-provider }}
          working-directory: ${{ inputs.working-directory }}
          result-file: ${{ inputs.project-result-file }}
          evidence-directory: ${{ inputs.project-evidence-dir }}
          upload-artifact: "false"

      # Intentional absence vs broken execution:
      # only list result files for providers that actually ran. An omitted
      # optional provider stays absent (no boundary effect); an omitted
      # required provider becomes UNKNOWN via missing-required semantics.
      # A listed-but-missing file stays INVALID/NOT_ESTABLISHED because the
      # generic aggregate action is strict about its explicit inputs.
      - name: Aggregate family verdict
        id: aggregate
        uses: epi13/mncs-actions/actions/aggregate@f6b70a897632e5c077633be7777847ee9c78feab
        with:
          checks: >-
            ${{ inputs.mncs-command != '' && inputs.mncs-result-file || '' }}
            ${{ inputs.rights-command != '' && inputs.rights-result-file || '' }}
            ${{ inputs.project-command != '' && inputs.project-result-file || '' }}
            ${{ inputs.additional-checks }}
          required: ${{ inputs.required-checks }}
          optional: ${{ inputs.optional-checks }}
          boundary: ${{ inputs.boundary }}
          working-directory: ${{ inputs.working-directory }}
          evidence-directory: ${{ inputs.aggregate-evidence-dir }}
          fail-on-unknown: ${{ inputs.fail-on-unknown }}
          strict-membership: "true"
          upload-artifact: ${{ inputs.upload-artifacts }}
          artifact-name: mncs-family-evidence

      - name: Render family badge
        id: badge
        if: always()
        uses: epi13/mncs-actions/actions/render-badge@f6b70a897632e5c077633be7777847ee9c78feab
        with:
          verdict: ${{ steps.aggregate.outputs.verdict || 'INVALID' }}
          label: ${{ inputs.badge-label }}
          output-file: ${{ inputs.badge-file }}
          sidecar-file: ${{ inputs.badge-sidecar-file }}
          working-directory: ${{ inputs.working-directory }}
          repository: ${{ github.repository }}
          subject-commit: ${{ github.sha }}
          boundary: ${{ inputs.boundary }}
          aggregate-digest: ${{ steps.aggregate.outputs.aggregate-digest }}
          manifest-digest: ${{ steps.aggregate.outputs.manifest-digest }}
          carrier-revision: ${{ inputs.carrier-revision }}
